<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MIRROR studio</title>
  <meta name="description" content="Teach a simulated robot what you mean, then test its understanding.">
  <link rel="stylesheet" href="styles.css">
  <script src="config.js"></script>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
      "preact": "https://esm.sh/preact@10.24.3",
      "preact/hooks": "https://esm.sh/preact@10.24.3/hooks",
      "htm": "https://esm.sh/htm@3.1.1"
    }
  }
  </script>
  <script>
    (function () {
      var t = localStorage.getItem('mirror-theme');
      if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.theme = t;
    })();
  </script>
</head>
<body>
  <div id="app"><div class="boot">Loading studio…</div></div>
  <noscript>The MIRROR studio needs JavaScript.</noscript>
  <script type="module" src="js/main.js"></script>
</body>
</html>
