[project]
name = "mirror-robot"
version = "0.1.0"
description = "Teach a simulated robot what you mean, then test its understanding: a MuJoCo task-authoring and correction-testing studio."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "mujoco>=3.2",
  "numpy>=1.26",
  "scipy>=1.11",
  "pydantic>=2.6",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "httpx>=0.27",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "playwright>=1.45"]
video = ["imageio>=2.34", "imageio-ffmpeg>=0.5"]
# SAM 3.1 output decoding (mirror.meta.sam); imported only when segmentation output is parsed
meta = ["meta-sam-parser>=0.1.0"]
# Calibration board detection for real camera footage (mirror.perception.calibration.detect_board);
# the calibration maths itself needs only numpy/scipy
camera = ["opencv-python-headless==4.10.0.84"]

[project.scripts]
mirror = "mirror.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mirror*"]

[tool.setuptools.package-data]
# Vendored robot models with their BSD-3-Clause licences and NOTICE must ship in
# every wheel; the JSON case files and designs are read at run time.
mirror = ["assets/NOTICE", "assets/**/*"]
"*" = ["*.json", "*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
