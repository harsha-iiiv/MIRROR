[project]
name = "mirror-robot"
version = "0.1.0"
description = "Teach a simulated robot what you mean, then test its understanding: a MuJoCo task-authoring and correction-testing studio."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "mujoco>=3.2",
  "numpy>=1.26",
  "scipy>=1.11",
  "pydantic>=2.6",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "httpx>=0.27",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "playwright>=1.45"]
video = ["imageio>=2.34", "imageio-ffmpeg>=0.5"]
# SAM 3.1 output decoding (mirror.meta.sam); imported only when segmentation output is parsed
meta = ["meta-sam-parser>=0.1.0"]
# Phone capture (mirror.capture): ChArUco/ArUco detection and calibration (cv2.aruco ships in the
# main opencv package since 4.7, so the contrib build is not needed); Pillow writes the PNG target
capture = ["opencv-python-headless==4.10.0.84", "pillow>=10"]

[project.scripts]
mirror = "mirror.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mirror*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
